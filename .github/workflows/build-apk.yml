                      val bodyW = size.width - 4f
                      val bodyH = size.height
                      drawRoundRect(
                          color = color.copy(alpha = if (showPercent) 0.25f else 0.48f),
                          topLeft = Offset.Zero,
                          size = Size(bodyW, bodyH),
                          cornerRadius = CornerRadius(6f, 6f),
                          style = if (showPercent) androidx.compose.ui.graphics.drawscope.Fill else Stroke(2.2f)

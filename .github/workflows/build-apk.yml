name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android Project Structure
        run: |
          mkdir -p app/src/main/res/values app/src/main/res/xml app/src/main/res/drawable app/src/main/res/drawable-nodpi app/src/main/java/com/irecstudio/state app/src/main/java/com/irecstudio/ui app/src/main/java/com/irecstudio/service

          shopt -s nullglob
          pngs=(*.png)
          jpgs=(*.jpg *.jpeg)
          if [ -f "icon.png" ]; then
            cp "icon.png" app/src/main/res/drawable-nodpi/app_icon.png
          elif [ -f "icon.jpg" ]; then
            cp "icon.jpg" app/src/main/res/drawable-nodpi/app_icon.jpg
          elif [ -f "icon.jpeg" ]; then
            cp "icon.jpeg" app/src/main/res/drawable-nodpi/app_icon.jpg
          elif [ ${#pngs[@]} -gt 0 ]; then
            cp "${pngs[0]}" app/src/main/res/drawable-nodpi/app_icon.png
          elif [ ${#jpgs[@]} -gt 0 ]; then
            cp "${jpgs[0]}" app/src/main/res/drawable-nodpi/app_icon.jpg
          else
            cat << 'EOF' > app/src/main/res/drawable/app_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#090A0F" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FF3B30" android:pathData="M54,54m-28,0a28,28 0,1 1,56 0a28,28 0,1 1,-56 0" />
              <path android:fillColor="#FFFFFF" android:pathData="M54,54m-11,0a11,11 0,1 1,22 0a11,11 0,1 1,-22 0" />
          </vector>
          EOF
          fi

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "iRecStudio"
          include(":app")
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.0" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.irecstudio"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.irecstudio"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.lifecycle:lifecycle-service:2.8.2")
              implementation("androidx.savedstate:savedstate-ktx:1.2.1")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">iRec Studio</string>
              <string name="accessibility_service_desc">Detects browser apps to animate the Dynamic Island mic dot</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:description="@string/accessibility_service_desc"
              android:notificationTimeout="80" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".service.OverlayStatusBarService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Status bar and Dynamic Island overlay" />
                  </service>

                  <service
                      android:name=".service.ScreenRecordService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection|microphone" />

                  <service
                      android:name=".service.BrowserAccessibilityService"
                      android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/irecstudio/state/OverlayStateHolder.kt
          package com.irecstudio.state

          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.update

          data class OverlayUiState(
              val overlayRunning: Boolean = false,
              val showIsland: Boolean = true,
              val showStatusBar: Boolean = true,
              val topEdgeFullWidth: Boolean = false,
              val isRecording: Boolean = false,
              val isPaused: Boolean = false,
              val elapsedSeconds: Int = 0,
              val micEnabled: Boolean = true,
              val isBrowserActive: Boolean = false,
              val forceBrowserPreview: Boolean = false,
              val airplaneMode: Boolean = false,
              val cellularData: Boolean = true,
              val wifiOn: Boolean = true,
              val bluetooth: Boolean = false,
              val hotspot: Boolean = false,
              val doNotDisturb: Boolean = false,
              val location: Boolean = false,
              val lowPowerMode: Boolean = false,
              val showBatteryPercent: Boolean = false,
              val batteryLevel: Int = 85,
              val expanded: Boolean = false
          )

          object OverlayStateHolder {
              private val _state = MutableStateFlow(OverlayUiState())
              val state: StateFlow<OverlayUiState> = _state.asStateFlow()

              var onStopRecordingRequested: (() -> Unit)? = null
              var onPauseResumeRequested: (() -> Unit)? = null

              fun setOverlayRunning(running: Boolean) = _state.update { it.copy(overlayRunning = running) }
              fun toggleIsland() = _state.update { it.copy(showIsland = !it.showIsland) }
              fun toggleStatusBar() = _state.update { it.copy(showStatusBar = !it.showStatusBar) }
              fun toggleTopEdge() = _state.update { it.copy(topEdgeFullWidth = !it.topEdgeFullWidth) }
              fun toggleMic() = _state.update { it.copy(micEnabled = !it.micEnabled) }
              fun toggleBrowserPreview() = _state.update { it.copy(forceBrowserPreview = !it.forceBrowserPreview) }
              fun toggleAirplane() = _state.update {
                  val next = !it.airplaneMode
                  it.copy(airplaneMode = next, cellularData = if (next) false else true, wifiOn = !next)
              }
              fun toggleCellular() = _state.update { it.copy(cellularData = !it.cellularData, airplaneMode = false) }
              fun toggleWifi() = _state.update { it.copy(wifiOn = !it.wifiOn, airplaneMode = false) }
              fun toggleBluetooth() = _state.update { it.copy(bluetooth = !it.bluetooth) }
              fun toggleHotspot() = _state.update { it.copy(hotspot = !it.hotspot, airplaneMode = false) }
              fun toggleDnd() = _state.update { it.copy(doNotDisturb = !it.doNotDisturb) }
              fun toggleLocation() = _state.update { it.copy(location = !it.location) }
              fun toggleLowPower() = _state.update { it.copy(lowPowerMode = !it.lowPowerMode) }
              fun toggleBatteryPercent() = _state.update { it.copy(showBatteryPercent = !it.showBatteryPercent) }
              fun toggleExpanded() = _state.update { it.copy(expanded = !it.expanded) }
              fun setExpanded(v: Boolean) = _state.update { it.copy(expanded = v) }
              fun setBrowserActive(active: Boolean) = _state.update { it.copy(isBrowserActive = active) }
              fun setPaused(paused: Boolean) = _state.update { it.copy(isPaused = paused) }
              fun setRecording(recording: Boolean, elapsed: Int = 0) = _state.update {
                  it.copy(isRecording = recording, isPaused = false, elapsedSeconds = elapsed)
              }
              fun updateElapsed(seconds: Int) = _state.update { it.copy(elapsedSeconds = seconds) }
              fun updateBattery(level: Int) = _state.update { it.copy(batteryLevel = level.coerceIn(1, 100)) }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/irecstudio/ui/DynamicStatusOverlay.kt
          package com.irecstudio.ui

          import androidx.compose.animation.AnimatedVisibility
          import androidx.compose.animation.animateColorAsState
          import androidx.compose.animation.core.*
          import androidx.compose.animation.expandVertically
          import androidx.compose.animation.fadeIn
          import androidx.compose.animation.fadeOut
          import androidx.compose.animation.shrinkVertically
          import androidx.compose.animation.scaleIn
          import androidx.compose.animation.scaleOut
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.interaction.MutableInteractionSource
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.shadow
          import androidx.compose.ui.geometry.CornerRadius
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.StrokeCap
          import androidx.compose.ui.graphics.TransformOrigin
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.irecstudio.state.OverlayStateHolder
          import com.irecstudio.state.OverlayUiState
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlinx.coroutines.delay

          @Composable
          fun DynamicStatusOverlay(state: OverlayUiState, isPreview: Boolean = false) {
              if (!state.showIsland && !state.showStatusBar && !state.isRecording) return

              var clockText by remember { mutableStateOf("") }
              LaunchedEffect(Unit) {
                  val fmt = SimpleDateFormat("h:mm", Locale.US)
                  while (true) {
                      clockText = fmt.format(Date())
                      delay(5_000)
                  }
              }

              val micOutside = (state.isRecording && state.isBrowserActive) || state.forceBrowserPreview
              val fgColor by animateColorAsState(
                  targetValue = if (micOutside) Color(0xFF0F172A) else Color.White,
                  animationSpec = tween(250),
                  label = "fg"
              )

              val timerText = remember(state.elapsedSeconds) {
                  val m = state.elapsedSeconds / 60
                  val s = state.elapsedSeconds % 60
                  String.format(Locale.US, "%02d:%02d", m, s)
              }

              val inf = rememberInfiniteTransition(label = "pulse")
              val pulseAlpha by inf.animateFloat(
                  initialValue = 1f,
                  targetValue = 0.35f,
                  animationSpec = infiniteRepeatable(tween(650), RepeatMode.Reverse),
                  label = "pulseAlpha"
              )

              val fullWidth = state.topEdgeFullWidth && !isPreview
              val pillBrush = if (micOutside) {
                  Brush.linearGradient(listOf(Color(0xFFF2F3F6), Color(0xFFF2F3F6)))
              } else {
                  Brush.linearGradient(listOf(Color(0xFF2B3348), Color(0xFF3E394B), Color(0xFF252C3D)))
              }

              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(horizontal = if (fullWidth) 0.dp else 10.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  if (state.showStatusBar) {
                      val shape = if (fullWidth) RoundedCornerShape(0.dp) else RoundedCornerShape(28.dp)
                      Box(
                          modifier = Modifier
                              .then(if (fullWidth) Modifier.fillMaxWidth() else Modifier.widthIn(max = 420.dp).fillMaxWidth())
                              .height(if (fullWidth) 46.dp else 54.dp)
                              .shadow(if (fullWidth) 2.dp else 14.dp, shape)
                              .clip(shape)
                              .background(pillBrush)
                              .padding(horizontal = 16.dp)
                      ) {
                          // Left: iPhone Clock / Timer + DND + Location
                          Row(
                              modifier = Modifier
                                  .align(Alignment.CenterStart)
                                  .clickable(
                                      interactionSource = remember { MutableInteractionSource() },
                                      indication = null
                                  ) { OverlayStateHolder.toggleExpanded() }
                                  .padding(start = 6.dp),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.spacedBy(5.dp)
                          ) {
                              if (!state.showIsland && state.isRecording) {
                                  Box(
                                      modifier = Modifier
                                          .size(8.dp)
                                          .clip(CircleShape)
                                          .background(
                                              if (state.isPaused) Color(0xFFFF9F0A)
                                              else Color(0xFFFF3B30).copy(alpha = pulseAlpha)
                                          )
                                  )
                              }
                              Text(
                                  text = if (state.isRecording) timerText else clockText,
                                  color = fgColor,
                                  fontSize = 15.sp,
                                  fontWeight = FontWeight.SemiBold,
                                  letterSpacing = (-0.3).sp
                              )
                              if (state.doNotDisturb) {
                                  IosMoonIcon(fgColor)
                              }
                              if (state.location) {
                                  IosLocationIcon(fgColor)
                              }
                          }

                          // Center: Pitch-Black Dynamic Island Pill
                          if (state.showIsland) {
                              Box(modifier = Modifier.align(Alignment.Center)) {
                                  IslandPill(
                                      state = state,
                                      micOutside = micOutside,
                                      pulseAlpha = if (state.isRecording && !state.isPaused) pulseAlpha else 1f,
                                      standalone = false
                                  )
                              }
                          }

                          // Right: iPhone Vector Icons (Signal + Wi-Fi + Battery)
                          Row(
                              modifier = Modifier
                                  .align(Alignment.CenterEnd)
                                  .padding(end = 2.dp),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.spacedBy(5.dp)
                          ) {
                              if (!state.showIsland && state.micEnabled) {
                                  Box(
                                      modifier = Modifier
                                          .size(7.dp)
                                          .clip(CircleShape)
                                          .background(Color(0xFFFF9F0A))
                                  )
                              }
                              if (state.airplaneMode) {
                                  Text("✈", color = fgColor, fontSize = 12.sp)
                              } else if (!micOutside) {
                                  IosSignalIcon(color = fgColor, active = state.cellularData)
                              }
                              if (state.hotspot) {
                                  IosHotspotIcon()
                              } else if (state.wifiOn) {
                                  IosWifiIcon(color = fgColor)
                              }
                              IosBatteryIcon(
                                  color = fgColor,
                                  level = state.batteryLevel,
                                  lowPower = state.lowPowerMode,
                                  showPercent = state.showBatteryPercent
                              )
                          }
                      }
                  } else if (state.showIsland) {
                      Box(modifier = Modifier.padding(top = 6.dp)) {
                          IslandPill(
                              state = state,
                              micOutside = micOutside,
                              pulseAlpha = if (state.isRecording && !state.isPaused) pulseAlpha else 1f,
                              standalone = true
                          )
                      }
                  } else if (state.isRecording) {
                      Row(
                          modifier = Modifier
                              .padding(top = 6.dp)
                              .clip(CircleShape)
                              .background(Color(0xF012141C))
                              .border(1.dp, Color.White.copy(alpha = 0.14f), CircleShape)
                              .clickable { OverlayStateHolder.toggleExpanded() }
                              .padding(horizontal = 14.dp, vertical = 7.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          Box(
                              Modifier
                                  .size(9.dp)
                                  .clip(CircleShape)
                                  .background(Color(0xFFFF3B30).copy(alpha = pulseAlpha))
                          )
                          Text(text = timerText, color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                      }
                  }

                  // Bouncy iOS Spring Expanded Live Activity Card
                  AnimatedVisibility(
                      visible = state.expanded,
                      enter = scaleIn(
                          initialScale = 0.55f,
                          transformOrigin = TransformOrigin(0.5f, 0f),
                          animationSpec = spring(dampingRatio = 0.62f, stiffness = 420f)
                      ) + expandVertically(expandFrom = Alignment.Top) + fadeIn(tween(150)),
                      exit = scaleOut(
                          targetScale = 0.55f,
                          transformOrigin = TransformOrigin(0.5f, 0f),
                          animationSpec = spring(dampingRatio = 0.85f, stiffness = 480f)
                      ) + shrinkVertically(shrinkTowards = Alignment.Top) + fadeOut(tween(120))
                  ) {
                      ExpandedLiveActivityCard(
                          state = state,
                          timerText = timerText,
                          pulseAlpha = pulseAlpha
                      )
                  }
              }
          }

          @Composable
          private fun IslandPill(
              state: OverlayUiState,
              micOutside: Boolean,
              pulseAlpha: Float,
              standalone: Boolean
          ) {
              // Continuous horizontal position so the orange dot visibly slides from inside Island to outside right!
              val dotOffsetX by animateDpAsState(
                  targetValue = if (micOutside) 40.dp else 0.dp,
                  animationSpec = spring(dampingRatio = 0.64f, stiffness = 340f),
                  label = "dotSlide"
              )
              val pillScale by animateFloatAsState(
                  targetValue = if (state.expanded) 0.94f else 1f,
                  animationSpec = spring(dampingRatio = 0.6f, stiffness = 420f),
                  label = "pillTap"
              )

              Box(contentAlignment = Alignment.Center) {
                  Row(
                      modifier = Modifier
                          .width((154 * pillScale).dp)
                          .height(34.dp)
                          .shadow(if (standalone) 12.dp else 0.dp, CircleShape)
                          .clip(CircleShape)
                          .background(Color.Black)
                          .then(
                              if (standalone) Modifier.border(1.dp, Color.White.copy(alpha = 0.14f), CircleShape)
                              else Modifier
                          )
                          .clickable(
                              interactionSource = remember { MutableInteractionSource() },
                              indication = null
                          ) { OverlayStateHolder.toggleExpanded() }
                          .padding(horizontal = 13.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.SpaceBetween
                  ) {
                      // Left Red Record Circle
                      Box(
                          modifier = Modifier
                              .size(13.dp)
                              .clip(CircleShape)
                              .background(
                                  if (state.isPaused) Color(0xFFFF9F0A)
                                  else Color(0xFFFF3B30).copy(alpha = pulseAlpha)
                              )
                      )

                      if (standalone && state.isRecording) {
                          val m = state.elapsedSeconds / 60
                          val s = state.elapsedSeconds % 60
                          Text(
                              text = String.format(Locale.US, "%02d:%02d", m, s),
                              color = Color.White,
                              fontSize = 11.sp,
                              fontWeight = FontWeight.SemiBold
                          )
                      }

                      // Placeholder spacing on right-center inside Island
                      Box(modifier = Modifier.padding(end = if (standalone) 6.dp else 22.dp)) {
                          if (state.micEnabled && !micOutside) {
                              Box(
                                  modifier = Modifier
                                      .size(6.5.dp)
                                      .clip(CircleShape)
                                      .background(Color(0xFFFF9F0A))
                              )
                          }
                      }
                  }

                  // Sliding outside orange dot (slides cleanly outside right edge when in browser)
                  if (state.micEnabled && dotOffsetX > 4.dp) {
                      Box(
                          modifier = Modifier
                              .align(Alignment.CenterEnd)
                              .offset(x = dotOffsetX - 24.dp)
                              .size(10.dp)
                              .clip(CircleShape)
                              .background(Color(0xFFFF9F0A))
                              .border(2.dp, Color.Black, CircleShape)
                      )
                  }
              }
          }

          @Composable
          private fun ExpandedLiveActivityCard(
              state: OverlayUiState,
              timerText: String,
              pulseAlpha: Float
          ) {
              val inf = rememberInfiniteTransition(label = "wave")
              val w1 by inf.animateFloat(0.3f, 1f, infiniteRepeatable(tween(420), RepeatMode.Reverse), label = "w1")
              val w2 by inf.animateFloat(0.9f, 0.25f, infiniteRepeatable(tween(360), RepeatMode.Reverse), label = "w2")
              val w3 by inf.animateFloat(0.4f, 0.95f, infiniteRepeatable(tween(490), RepeatMode.Reverse), label = "w3")
              val w4 by inf.animateFloat(0.8f, 0.3f, infiniteRepeatable(tween(390), RepeatMode.Reverse), label = "w4")
              val waveBars = listOf(w1, w2, w3, w4, w2, w1)

              Column(
                  modifier = Modifier
                      .padding(top = 6.dp)
                      .widthIn(max = 360.dp)
                      .fillMaxWidth()
                      .shadow(22.dp, RoundedCornerShape(30.dp))
                      .clip(RoundedCornerShape(30.dp))
                      .background(Color.Black)
                      .border(1.dp, Color.White.copy(alpha = 0.16f), RoundedCornerShape(30.dp))
                      .padding(16.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Row(
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          Box(
                              modifier = Modifier
                                  .size(34.dp)
                                  .clip(CircleShape)
                                  .background(Color(0xFFFF3B30).copy(alpha = 0.18f))
                                  .border(1.dp, Color(0xFFFF3B30).copy(alpha = 0.6f), CircleShape),
                              contentAlignment = Alignment.Center
                          ) {
                              Box(
                                  modifier = Modifier
                                      .size(13.dp)

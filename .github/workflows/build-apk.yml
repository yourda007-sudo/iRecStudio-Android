                  setContent {
                      val uiState by OverlayStateHolder.state.collectAsState()
                      var accEnabled by remember { mutableStateOf(isBrowserAccessibilityOn()) }

                      LaunchedEffect(uiState.overlayRunning, uiState.isRecording) {
                          accEnabled = isBrowserAccessibilityOn()
                      }

                      Column(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(Color(0xFF090A0F))
                              .systemBarsPadding()
                              .verticalScroll(rememberScrollState())
                              .padding(16.dp),
                          verticalArrangement = Arrangement.spacedBy(14.dp)
                      ) {
                          Text("iRec Studio", color = Color.White, fontSize = 22.sp, fontWeight = FontWeight.Bold)

                          // লাইভ প্রিভিউ (ঠিক ছবির মতো Dynamic Island + পূর্ণ স্ট্যাটাস বার)
                          DynamicStatusOverlay(state = uiState, isPreview = true)

                          // স্ট্যাটাস বার ওভারলে ও রেকর্ডিং বাটন
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(22.dp))
                                  .background(Color(0xFF12141C))
                                  .border(1.dp, Color.White.copy(alpha = 0.08f), RoundedCornerShape(22.dp))
                                  .padding(14.dp),
                              verticalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              Button(
                                  onClick = {
                                      if (!Settings.canDrawOverlays(this@MainActivity)) {
                                          startActivity(
                                              Intent(
                                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                                  Uri.parse("package:$packageName")
                                              )
                                          )
                                      } else if (uiState.overlayRunning) {
                                          stopService(Intent(this@MainActivity, OverlayStatusBarService::class.java))
                                      } else {
                                          startForegroundService(Intent(this@MainActivity, OverlayStatusBarService::class.java))
                                      }
                                  },
                                  colors = ButtonDefaults.buttonColors(
                                      containerColor = if (uiState.overlayRunning) Color(0xFF2C2F3A) else Color(0xFF0A84FF)
                                  ),
                                  modifier = Modifier.fillMaxWidth(),
                                  shape = RoundedCornerShape(14.dp)
                              ) {
                                  Text(
                                      if (uiState.overlayRunning) "ভাসমান স্ট্যাটাস বার বন্ধ করুন" else "ভাসমান স্ট্যাটাস বার চালু করুন",
                                      color = Color.White
                                  )
                              }

                              Button(
                                  onClick = {
                                      if (uiState.isRecording) {
                                          startService(Intent(this@MainActivity, ScreenRecordService::class.java).apply {
                                              action = "STOP_RECORDING"
                                          })
                                      } else {
                                          val mpm = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                                          projLauncher.launch(mpm.createScreenCaptureIntent())
                                      }
                                  },
                                  colors = ButtonDefaults.buttonColors(
                                      containerColor = if (uiState.isRecording) Color(0xFFFF3B30) else Color(0xFF30D158)
                                  ),
                                  modifier = Modifier.fillMaxWidth(),
                                  shape = RoundedCornerShape(14.dp)
                              ) {
                                  Text(
                                      if (uiState.isRecording) "রেকর্ডিং বন্ধ করুন" else "স্ক্রিন রেকর্ডিং শুরু করুন",
                                      color = if (uiState.isRecording) Color.White else Color.Black,
                                      fontWeight = FontWeight.Bold
                                  )
                              }
                          }

                          // আলাদা আলাদা সুইচ (Island ও স্ট্যাটাস বার)
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(22.dp))
                                  .background(Color(0xFF12141C))
                                  .border(1.dp, Color.White.copy(alpha = 0.08f), RoundedCornerShape(22.dp))
                                  .padding(14.dp),
                              verticalArrangement = Arrangement.spacedBy(6.dp)
                          ) {
                              Text("আইল্যান্ড ও স্ট্যাটাস বার (আলাদা কন্ট্রোল)", color = Color(0xFFCBD5E1), fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                              ToggleRow("Dynamic Island", uiState.showIsland) { OverlayStateHolder.toggleIsland() }
                              ToggleRow("পূর্ণ স্ট্যাটাস বার", uiState.showStatusBar) { OverlayStateHolder.toggleStatusBar() }
                              ToggleRow("একদম ওপরের প্রান্তে (Top Edge)", uiState.topEdgeFullWidth) { OverlayStateHolder.toggleTopEdge() }
                              ToggleRow("মাইক্রোফোন", uiState.micEnabled) { OverlayStateHolder.toggleMic() }
                              ToggleRow("ব্রাউজার মোড প্রিভিউ (হলুদ ডট ডানে)", uiState.forceBrowserPreview) { OverlayStateHolder.toggleBrowserPreview() }
                          }

                          // ব্রাউজার ডিটেকশন সেটিংস
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(22.dp))
                                  .background(Color(0xFF12141C))
                                  .border(1.dp, Color.White.copy(alpha = 0.08f), RoundedCornerShape(22.dp))
                                  .padding(14.dp),
                              verticalArrangement = Arrangement.spacedBy(8.dp)
                          ) {
                              Text(
                                  text = if (accEnabled) "Chrome/ব্রাউজার ডিটেকশন: চালু আছে ✓" else "Chrome/ব্রাউজার ডিটেকশন: বন্ধ আছে",
                                  color = if (accEnabled) Color(0xFF30D158) else Color(0xFFFF9F0A),
                                  fontSize = 13.sp,
                                  fontWeight = FontWeight.SemiBold
                              )
                              OutlinedButton(
                                  onClick = { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) },
                                  modifier = Modifier.fillMaxWidth(),
                                  shape = RoundedCornerShape(14.dp)
                              ) {
                                  Text("Accessibility থেকে iRec Studio অন করুন", color = Color.White, fontSize = 12.sp)
                              }
                          }

                          // আইফোন স্ট্যাটাস টগল
                          Column(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(22.dp))
                                  .background(Color(0xFF12141C))
                                  .border(1.dp, Color.White.copy(alpha = 0.08f), RoundedCornerShape(22.dp))
                                  .padding(14.dp),
                              verticalArrangement = Arrangement.spacedBy(6.dp)
                          ) {
                              Text("আইফোন স্ট্যাটাস টগল", color = Color(0xFFCBD5E1), fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                              ToggleRow("ওয়াই-ফাই (Wi-Fi)", uiState.wifiOn) { OverlayStateHolder.toggleWifi() }
                              ToggleRow("সিম নেট (Cellular)", uiState.cellularData) { OverlayStateHolder.toggleCellular() }
                              ToggleRow("হটস্পট (Hotspot)", uiState.hotspot) { OverlayStateHolder.toggleHotspot() }
                              ToggleRow("ফ্লাইট মোড (Airplane)", uiState.airplaneMode) { OverlayStateHolder.toggleAirplane() }
                              ToggleRow("DND (চাঁদ)", uiState.doNotDisturb) { OverlayStateHolder.toggleDnd() }
                              ToggleRow("লোকেশন", uiState.location) { OverlayStateHolder.toggleLocation() }
                              ToggleRow("লো পাওয়ার (হলুদ ব্যাটারি)", uiState.lowPowerMode) { OverlayStateHolder.toggleLowPower() }
                              ToggleRow("ব্যাটারি %", uiState.showBatteryPercent) { OverlayStateHolder.toggleBatteryPercent() }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun ToggleRow(label: String, checked: Boolean, onToggle: () -> Unit) {
              Row(
                  modifier = Modifier.fillMaxWidth(),
                  horizontalArrangement = Arrangement.SpaceBetween,
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Text(label, color = Color.White, fontSize = 14.sp)
                  Switch(checked = checked, onCheckedChange = { onToggle() })
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: iRecStudio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

          package com.irecstudio.service

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import com.irecstudio.state.OverlayStateHolder

          class BrowserAccessibilityService : AccessibilityService() {

              private val browserPackages = setOf(
                  "com.android.chrome",
                  "com.chrome.beta",
                  "com.chrome.dev",
                  "com.sec.android.app.sbrowser",
                  "org.mozilla.firefox",
                  "com.brave.browser",
                  "com.opera.browser",
                  "com.opera.mini.native",
                  "com.microsoft.emmx",
                  "com.UCMobile.intl"
              )

              private fun isIgnoredSystemOrKeyboard(pkg: String): Boolean {
                  return pkg == "com.android.systemui" ||
                      pkg == "com.irecstudio" ||
                      pkg.contains("inputmethod") ||
                      pkg.contains("keyboard") ||
                      pkg.contains("honeyboard") ||
                      pkg.contains("gboard") ||
                      pkg.contains("swiftkey") ||
                      pkg == "com.android.permissioncontroller" ||
                      pkg == "com.google.android.permissioncontroller"
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event?.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                      val pkg = event.packageName?.toString() ?: return
                      if (isIgnoredSystemOrKeyboard(pkg)) return
                      val isBrowser = pkg in browserPackages || pkg.contains("browser") || pkg.contains("chrome")
                      OverlayStateHolder.setBrowserActive(isBrowser)
                  }
              }

              override fun onInterrupt() {}
          }
